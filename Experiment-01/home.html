<!DOCTYPE html>
<html>
    <head>
        <title>Online Book Store</title>
    </head>

    <frameset rows="40%,*">

        <!-- Top Frame -->
         <frame
            src = "top.html"
            name = "topframe"
            noresize
            scrolling="no"
        ></frame>

        <frameset cols="15%,*">

            <!--- Left Navigation Frame -->
            <frame
                src="left.html"
                name="leftframe"
                noresize
                scrolling="no"
            ></frame>

            <!-- Main Content Frame -->
            <frame
                src="right.html"
                name="rightframe"
                noresize
                scrolling="auto"
            ></frame>

        </frameset>

    </frameset>
    
</html>
